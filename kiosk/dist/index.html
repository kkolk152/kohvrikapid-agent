<!-- __KIOSK_ERROR_OVERLAY__ -->
<script>
(function () {
  function esc(x){ return String(x||"").replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
  function show(title, detail){
    try{
      var pre = document.createElement('pre');
      pre.id = '__kiosk_error__';
      pre.style.cssText = 'white-space:pre-wrap;word-break:break-word;padding:16px;margin:0;font:14px/1.35 monospace;background:#fff;color:#b00020;';
      pre.innerHTML = esc(title) + "\\n\\n" + esc(detail);
      document.body.innerHTML = "";
      document.body.appendChild(pre);
    }catch(e){}
  }

  window.addEventListener('error', function (e) {
    var msg = (e && e.message) ? e.message : 'window error';
    var st = (e && e.error && e.error.stack) ? e.error.stack : '';
    show('JS ERROR', msg + (st ? "\\n\\n" + st : ""));
  });

  window.addEventListener('unhandledrejection', function (e) {
    var r = (e && e.reason) ? e.reason : 'unhandled rejection';
    var msg = (r && r.message) ? r.message : String(r);
    var st = (r && r.stack) ? r.stack : '';
    show('UNHANDLED PROMISE REJECTION', msg + (st ? "\\n\\n" + st : ""));
  });
})();
</script>


<!-- __MAINTENANCE_STATIC_OVERLAY__ -->
<script>
(function () {
  var API = "http://127.0.0.1:9122";
  var ID = "__maintenance_overlay__";
  var points = [];
  var drawing = false;

  function isAdminPath() {
    return String(location.pathname || "").indexOf("/admin") === 0;
  }

  function goAdmin() {
    hide();
    try {
      history.pushState({}, "", "/admin-pin");
      try {
        window.dispatchEvent(new PopStateEvent("popstate"));
      } catch (e) {
        window.dispatchEvent(new Event("popstate"));
      }
    } catch (e) {
      location.href = "/";
    }
  }

  function getPoint(ev) {
    var e = ev.touches && ev.touches[0] ? ev.touches[0] : ev;
    return { x: e.clientX || 0, y: e.clientY || 0, t: Date.now() };
  }

  function startGesture(ev) {
    drawing = true;
    points = [getPoint(ev)];
  }

  function moveGesture(ev) {
    if (!drawing) return;
    points.push(getPoint(ev));
  }

  function endGesture() {
    if (!drawing) return;
    drawing = false;

    if (points.length < 15) return;

    var xs = points.map(function (p) { return p.x; });
    var ys = points.map(function (p) { return p.y; });
    var minX = Math.min.apply(null, xs);
    var maxX = Math.max.apply(null, xs);
    var minY = Math.min.apply(null, ys);
    var maxY = Math.max.apply(null, ys);

    // liiga väike kriips ei loe
    if ((maxX - minX) < 80 || (maxY - minY) < 80) return;

    // Sama loogika nagu olemasolevas UI-s: 5 järjestikust segmenti,
    // mille y-keskmine teeb M/W-laadse mustri.
    var parts = 5;
    var step = Math.floor(points.length / parts);
    if (step < 2) return;

    var avg = [];
    for (var i = 0; i < parts; i++) {
      var slice = points.slice(i * step, i === parts - 1 ? points.length : (i + 1) * step);
      var sum = slice.reduce(function (a, p) { return a + p.y; }, 0);
      avg.push(sum / slice.length);
    }

    var mShape =
      (avg[0] < avg[1] && avg[1] > avg[2] && avg[2] < avg[3] && avg[3] > avg[4]) ||
      (avg[0] > avg[1] && avg[1] < avg[2] && avg[2] > avg[3] && avg[3] < avg[4]);

    if (mShape) {
      goAdmin();
    }
  }

  function hide() {
    var el = document.getElementById(ID);
    if (el) el.remove();
    document.documentElement.style.overflow = "";
    document.body.style.overflow = "";
  }

  function show(data) {
    if (isAdminPath()) {
      hide();
      return;
    }

    var el = document.getElementById(ID);
    if (!el) {
      el = document.createElement("div");
      el.id = ID;
      el.style.cssText = [
        "position:fixed",
        "inset:0",
        "z-index:999999",
        "background:#020617",
        "color:white",
        "display:flex",
        "flex-direction:column",
        "align-items:center",
        "justify-content:center",
        "text-align:center",
        "padding:48px",
        "font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif",
        "touch-action:none",
        "user-select:none"
      ].join(";");

      el.innerHTML =
        '<div style="font-size:56px;font-weight:900;margin-bottom:28px">Hooldustööd</div>' +
        '<div id="maint_et" style="font-size:32px;font-weight:700;max-width:900px;line-height:1.25"></div>' +
        '<div style="width:120px;height:4px;background:rgba(255,255,255,.25);border-radius:99px;margin:44px 0"></div>' +
        '<div style="font-size:56px;font-weight:900;margin-bottom:28px">Maintenance</div>' +
        '<div id="maint_en" style="font-size:32px;font-weight:700;max-width:900px;line-height:1.25;color:rgba(255,255,255,.9)"></div>';

      el.addEventListener("mousedown", startGesture);
      el.addEventListener("mousemove", moveGesture);
      el.addEventListener("mouseup", endGesture);
      el.addEventListener("mouseleave", endGesture);

      el.addEventListener("touchstart", startGesture, { passive: true });
      el.addEventListener("touchmove", moveGesture, { passive: true });
      el.addEventListener("touchend", endGesture);

      document.body.appendChild(el);
    }

    document.getElementById("maint_et").textContent = data.message_et || "Kiosk pole ajutiselt saadaval.";
    document.getElementById("maint_en").textContent = data.message_en || "The kiosk is temporarily unavailable.";
    document.documentElement.style.overflow = "hidden";
    document.body.style.overflow = "hidden";
  }

  async function poll() {
    try {
      var res = await fetch(API + "/maintenance", { cache: "no-store" });
      if (!res.ok) return;
      var data = await res.json();
      if (data && data.enabled) show(data);
      else hide();
    } catch (e) {}
  }

  window.addEventListener("DOMContentLoaded", function () {
    poll();
    setInterval(poll, 3000);
  });
})();
</script>


<script>
(function () {
  var started = Date.now();

  function hasVisibleContent() {
    var root = document.getElementById("root");
    if (!root) return false;
    var text = (root.innerText || "").trim();
    var rect = root.getBoundingClientRect();
    return text.length > 10 && rect.height > 100;
  }

  setTimeout(function () {
    try {
      if (!hasVisibleContent()) {
        var count = Number(sessionStorage.getItem("blank_reload_count") || "0");
        sessionStorage.setItem("blank_reload_count", String(count + 1));

        if (count < 2) {
          console.warn("Blank screen watchdog reload");
          location.reload();
        }
      }
    } catch (e) {}
  }, 12000);

  window.addEventListener("error", function (ev) {
    try {
      var item = {
        ts: new Date().toISOString(),
        message: ev.message,
        source: ev.filename,
        line: ev.lineno,
        col: ev.colno
      };
      localStorage.setItem("kiosk_last_window_error", JSON.stringify(item));
    } catch (e) {}
  });
})();
</script>
