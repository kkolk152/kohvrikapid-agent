# Kohvrikapid LAN — eth0 jagamine kui Pi on router-režiimis
# Paigaldatakse: /etc/dnsmasq.d/kohvrikapid-lan.conf
interface=eth0
bind-interfaces
domain-needed
bogus-priv
dhcp-range=192.168.100.50,192.168.100.200,255.255.255.0,12h
dhcp-option=option:router,192.168.100.1
dhcp-option=option:dns-server,1.1.1.1,8.8.8.8

# IP reservation MAC-i järgi — kui kontroller saab korra IP, hoiame seda
# samale MAC-le kuni see on aktiivne. 60 päeva inaktiivsus → cleanup script
# eemaldab kirje ja vabastab IP teisele seadmele.
dhcp-script=/usr/local/sbin/dhcp-reservation-hook.sh
conf-file=/etc/dnsmasq.d/kohvrikapid-reservations.conf
