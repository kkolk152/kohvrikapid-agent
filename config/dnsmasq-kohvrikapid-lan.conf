# Kohvrikapid LAN — eth0 jagamine kui Pi on router-režiimis
# Paigaldatakse: /etc/dnsmasq.d/kohvrikapid-lan.conf
interface=eth0
bind-interfaces
domain-needed
bogus-priv
dhcp-range=192.168.100.50,192.168.100.200,255.255.255.0,12h
dhcp-option=option:router,192.168.100.1
dhcp-option=option:dns-server,1.1.1.1,8.8.8.8
